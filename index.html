<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد منشورات التقليب</title>
<meta name="description" content="اكتب اسم منتجك، واحصل على 4 شرائح جاهزة للنشر بتصميم مدروس ونصوص عربية واضحة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee;
    --bg2: #efe9df;
    --card: #fffdf9;
    --ink: #201e1a;
    --muted: #6d675d;
    --line: #e3dccf;
    --brand: #23584a;
    --brand-soft: #e7efe9;
    --gold: #b08a4f;
    --danger: #a8342a;
    --shadow: 0 18px 50px -28px rgba(48, 38, 24, .45);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, #fffdf6 0%, rgba(255,253,246,0) 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--ink);
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; padding: 40px 18px 80px; }
  header { margin-bottom: 26px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: .2px;
    color: var(--brand); background: var(--brand-soft);
    border: 1px solid #d7e4dc; border-radius: 100px; padding: 5px 12px;
  }
  .kicker i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: block; }
  h1 { font-size: clamp(26px, 4.4vw, 34px); font-weight: 800; margin: 12px 0 6px; letter-spacing: -.2px; }
  .sub { color: var(--muted); margin: 0; font-size: 16px; max-width: 60ch; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .row { grid-template-columns: 1fr; } }
  label { display: block; font-weight: 700; margin: 16px 0 6px; font-size: 15px; }
  label:first-child { margin-top: 0; }
  label .opt { color: var(--muted); font-weight: 400; font-size: 13px; }
  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 92px; resize: vertical; }
  input[type=text]::placeholder, textarea::placeholder { color: #a49c8f; }
  input[type=text]:focus, textarea:focus, button:focus-visible, .drop:focus-visible {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 4px rgba(35, 88, 74, .12);
  }
  .hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }

  .drop {
    display: flex; align-items: center; gap: 14px;
    border: 1.5px dashed #d8cfbe;
    border-radius: 14px;
    padding: 14px;
    background: #fdfbf6;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--brand); background: #f8faf7; }
  .drop input { display: none; }
  .thumb {
    width: 56px; height: 56px; border-radius: 10px; flex: none;
    background: #f1ece2 var(--thumb) center/cover no-repeat;
    border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--muted); font-size: 20px;
  }
  .drop b { display: block; font-size: 15px; }
  .drop small { color: var(--muted); font-size: 13px; }

  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 12px; border: 1px solid transparent;
    padding: 12px 20px; font-size: 16px;
    transition: transform .12s, background .15s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  .primary { background: var(--brand); color: #fff; flex: 1 1 220px; }
  .primary:hover { background: #1c4a3d; }
  .primary:disabled { opacity: .65; cursor: progress; }
  .ghost { background: #fff; color: var(--brand); border-color: #cfdcd5; }
  .ghost:hover { background: var(--brand-soft); }
  .ghost:disabled { opacity: .5; cursor: not-allowed; }

  #msg { margin: 16px 0 0; min-height: 24px; font-size: 15px; color: var(--muted); }
  #msg.err { color: var(--danger); }
  .spinner {
    display: inline-block; width: 15px; height: 15px; margin-inline-end: 8px;
    border: 2px solid #cfd8d3; border-top-color: var(--brand); border-radius: 50%;
    animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { margin-top: 36px; display: none; }
  #results.on { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .bar h2 { margin: 0; font-size: 21px; font-weight: 800; }
  .bar .meta { color: var(--muted); font-size: 14px; }
  .slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .slide {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 10px; box-shadow: 0 10px 30px -24px rgba(48,38,24,.5);
  }
  .slide canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
  .slide .tools { display: flex; gap: 8px; margin-top: 10px; }
  .slide .tools button { flex: 1; padding: 9px 10px; font-size: 14px; }
  footer { margin-top: 44px; color: var(--muted); font-size: 13.5px; text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <header>
    <span class="kicker"><i></i> تصميم عربي جاهز للنشر</span>
    <h1>مولّد منشورات التقليب</h1>
    <p class="sub">اكتب اسم منتجك، ويكتب الذكاء الاصطناعي النص ويختار الألوان، ثم تُبنى أربع شرائح بتصميم متناسق وتنويع بصري بين كل شريحة.</p>
  </header>

  <section class="panel">
    <label for="product">اسم المنتج <span class="opt">(مطلوب)</span></label>
    <input type="text" id="product" maxlength="200" placeholder="مثال: عطر عود فاخر" autocomplete="off">

    <label for="details">وصف قصير <span class="opt">(اختياري)</span></label>
    <textarea id="details" maxlength="800" placeholder="مثال: يدوم ١٢ ساعة، رائحة دافئة، مناسب للهدايا والعيد"></textarea>

    <div class="row">
      <div>
        <label for="offer">السعر أو العرض <span class="opt">(اختياري)</span></label>
        <input type="text" id="offer" maxlength="150" placeholder="٩ ريال عماني، توصيل مجاني">
      </div>
      <div>
        <label for="tone">الأسلوب <span class="opt">(اختياري)</span></label>
        <input type="text" id="tone" maxlength="100" placeholder="فخم، حماسي، بسيط…">
      </div>
    </div>

    <label for="photo">صورة المنتج <span class="opt">(اختياري)</span></label>
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="photo" accept="image/*">
      <span class="thumb" id="thumb" aria-hidden="true">＋</span>
      <span>
        <b id="dropTitle">أضف صورة المنتج</b>
        <small id="dropSub">اسحب الصورة هنا أو اضغط للاختيار — تبقى في جهازك ولا تُرفع.</small>
      </span>
    </label>

    <div class="actions">
      <button class="primary" id="go">أنشئ المنشور</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="results" aria-live="polite">
    <div class="bar">
      <div>
        <h2>الشرائح الأربع</h2>
        <div class="meta" id="meta"></div>
      </div>
      <div class="actions" style="margin:0">
        <button class="ghost" id="vary" title="يغيّر الشكل دون استهلاك أي طلب جديد">تنويع التصميم</button>
        <button class="ghost" id="all">تحميل الكل</button>
      </div>
    </div>
    <div class="slides" id="slides"></div>
  </section>

  <footer>التصميم يُرسم داخل متصفحك بجودة ١٠٨٠×١٠٨٠ بكسل — ولا تُرسل الصورة إلى أي خادم.</footer>
</main>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const E = window.CarouselEngine;
  const $ = (id) => document.getElementById(id);
  const SIZE = E.SIZE;
  const MAX_UPLOAD = 1600;

  const THEME_LABEL = {
    arch: 'قوس', split: 'انقسام', editorial: 'مجلاتي', band: 'شريط',
    circle: 'دائرة', grid: 'شبكة', wave: 'موجة', ticket: 'تذكرة',
    offset: 'إطار مائل', diagonal: 'مائل', halftone: 'نقاط متدرجة',
    polaroid: 'بولارويد', corner: 'زوايا', fullbleed: 'صورة كاملة'
  };

  const state = { deck: null, motif: null, palette: null, seed: 0, img: null, key: '', cache: new Map(), busy: false };

  /* ---------- الصورة ---------- */
  function setPhoto(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let src = img;
      const big = Math.max(img.width, img.height);
      if (big > MAX_UPLOAD) {
        const c = document.createElement('canvas');
        const s = MAX_UPLOAD / big;
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        src = c;
      }
      state.img = src;
      $('thumb').style.setProperty('--thumb', 'url(' + url + ')');
      $('thumb').textContent = '';
      $('dropTitle').textContent = file.name.length > 34 ? file.name.slice(0, 31) + '…' : file.name;
      $('dropSub').textContent = 'اضغط لتغيير الصورة';
      if (state.deck) drawDeck();
    };
    img.onerror = () => setMsg('تعذّر قراءة الصورة، جرّب صورة أخرى.', true);
    img.src = url;
  }

  const drop = $('drop');
  drop.addEventListener('click', () => $('photo').click());
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('photo').click(); } });
  $('photo').addEventListener('change', (e) => setPhoto(e.target.files[0]));
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) setPhoto(e.dataTransfer.files[0]); });

  /* ---------- helpers ---------- */
  function setMsg(text, isErr) {
    const m = $('msg');
    m.innerHTML = '';
    if (!text) { m.className = ''; return; }
    m.textContent = text;
    m.className = isErr ? 'err' : '';
  }
  function setBusy(on, label) {
    state.busy = on;
    $('go').disabled = on;
    if (on) {
      $('msg').className = '';
      $('msg').innerHTML = '<span class="spinner"></span>' + (label || 'نكتب النص ونختار الألوان…');
    } else if ($('msg').querySelector('.spinner')) {
      $('msg').textContent = '';
    }
  }

  /* ---------- التوليد ---------- */
  async function generate() {
    if (state.busy) return;
    const product = $('product').value.trim();
    if (!product) { setMsg('اكتب اسم المنتج أولاً.', true); $('product').focus(); return; }

    const payload = {
      product,
      details: $('details').value.trim(),
      offer: $('offer').value.trim(),
      tone: $('tone').value.trim(),
      avoid: state.motif || ''
    };
    const key = JSON.stringify([payload.product, payload.details, payload.offer, payload.tone]);

    setBusy(true);
    try {
      let data = state.cache.get(key);
      if (!data) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 45000);
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        let body = null;
        try { body = await res.json(); } catch (e) { body = null; }
        if (!res.ok) throw new Error((body && body.error) || 'تعذّر الاتصال بالخدمة (' + res.status + ')');
        data = body;
        if (!data || !Array.isArray(data.slides) || data.slides.length < 4) throw new Error('وصل رد ناقص، جرّب مرة ثانية.');
        state.cache.set(key, data);
      }
      state.deck = data;
      state.palette = E.palette(data.palette);
      state.motif = data.motif && E.MOTIFS.indexOf(data.motif) > -1 ? data.motif : E.pickMotif(payload.avoid, Date.now());
      state.seed = Number(data.seed) || Math.floor(Math.random() * 1e6);
      state.key = key;

      await document.fonts.ready;
      drawDeck();
      setMsg('جاهز — حمّل الشرائح أو اضغط «تنويع التصميم» لشكل آخر بنفس النص.');
    } catch (err) {
      const msg = err && err.name === 'AbortError'
        ? 'الخدمة تأخّرت أكثر من ٤٥ ثانية، جرّب مرة ثانية.'
        : (err.message || 'تعذّر إنشاء المنشور، جرّب مرة ثانية.');
      setMsg(msg, true);
    } finally {
      setBusy(false);
      $('results').classList.add('on');
    }
  }

  /* ---------- الرسم ---------- */
  function drawDeck() {
    if (!state.deck) return;
    const box = $('slides');
    box.innerHTML = '';
    const slides = state.deck.slides.slice(0, 4);
    slides.forEach((slide, i) => {
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      E.drawSlide(canvas.getContext('2d'), {
        p: state.palette,
        motif: state.motif,
        slide: slide,
        index: i,
        img: state.img,
        seed: state.seed
      });

      const wrap = document.createElement('div');
      wrap.className = 'slide';
      const btn = document.createElement('button');
      btn.className = 'ghost';
      btn.textContent = 'تحميل ' + E.arNum(i + 1);
      btn.addEventListener('click', () => download(canvas, i));
      wrap.append(canvas, btn);
      box.appendChild(wrap);
    });
    $('meta').textContent = 'النمط: ' + (THEME_LABEL[state.motif] || state.motif) + ' · ١٠٨٠×١٠٨٠';
    $('results').classList.add('on');
  }

  function slug(s) { return String(s || 'carousel').trim().replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40); }

  function download(canvas, i) {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = slug($('product').value) + '-' + E.arNum(i + 1) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  }

  /* ---------- الأزرار ---------- */
  $('go').addEventListener('click', generate);
  $('product').addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });

  $('vary').addEventListener('click', () => {
    if (!state.deck) return;
    let next = E.pickMotif(state.motif, Date.now() + state.seed);
    if (next === state.motif) next = E.MOTIFS[(E.MOTIFS.indexOf(state.motif) + 1) % E.MOTIFS.length];
    state.motif = next;
    state.seed = Math.floor(Math.random() * 1e6);
    drawDeck();
    setMsg('شكل جديد بنفس النص — بدون أي طلب جديد للخدمة.');
  });

  $('all').addEventListener('click', () => {
    document.querySelectorAll('#slides canvas').forEach((cv, i) => {
      setTimeout(() => download(cv, i), i * 350);
    });
  });
})();
</script>
</body>
</html>
